<iframe
  id="ldc-widget"
  src="https://barryedavids-prog.github.io/ldc-widget/staging/"
  title="A gentle check-in"
  style="width:100%; height:640px; border:0; display:block;"
  scrolling="no"
  loading="lazy"></iframe>

<script>
(function () {
  var frame = document.getElementById('ldc-widget');
  var ORIGIN = 'https://barryedavids-prog.github.io';   // only trust messages from here

  window.addEventListener('message', function (event) {
    if (event.origin !== ORIGIN) return;                 // ignore other sites
    if (event.source !== frame.contentWindow) return;    // ignore other iframes
    var data = event.data;
    if (!data || data.type !== 'ldc-widget-height') return;
    var height = Number(data.height);
    if (isFinite(height) && height > 0) {
      frame.style.height = height + 'px';                // resize: no scrollbars
    }
  });
})();
</script>
